<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Matrix Rain — Canvas2D (CPU) vs WebGL2 (GPU) benchmark</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #050505;
        color: #b9ffd6;
        font: 13px/1.5 ui-monospace, monospace;
      }
      header {
        padding: 12px 16px 4px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
        font-weight: 600;
      }
      #status {
        color: #6fdc9b;
      }
      #gpu-name {
        color: #8fa8ff;
      }
      main {
        display: flex;
        gap: 12px;
        padding: 12px 16px 24px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-bottom: 4px;
        color: #7dffb0;
      }
      canvas {
        display: block;
        background: #000;
        border: 1px solid #123;
        transition: opacity 0.15s;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Matrix Rain — CPU vs GPU benchmark</h1>
      <div id="status"></div>
      <div id="gpu-name"></div>
    </header>
    <main>
      <figure>
        <figcaption>Canvas 2D — CPU rasterisation</figcaption>
        <canvas id="cpu"></canvas>
      </figure>
      <figure>
        <figcaption>WebGL2 instanced — GPU</figcaption>
        <canvas id="gpu"></canvas>
      </figure>
    </main>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
